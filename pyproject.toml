[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "montecarlo-dsl"
version = "1.3.1"
description = "Monte Carlo DSL compiler, concurrent NumPy runtime generator, and FastAPI/WebSocket backend"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "fastapi>=0.92.0",
    "pydantic>=1.10.4",
    "uvicorn>=0.17.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.23.0",
    "scipy>=1.10.0",
    "packaging>=23.0",
    "matplotlib>=3.8",
    "psutil==7.2.2",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
"montecarlo_dsl" = ["static/*.html", "static/*.css", "static/*.js", "static/vendor/*.js"]
