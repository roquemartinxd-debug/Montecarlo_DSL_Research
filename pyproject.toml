[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "montecarlo-dsl"
version = "1.1.0"
description = "Monte Carlo DSL compiler, concurrent NumPy runtime generator, and FastAPI/WebSocket backend"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
"montecarlo_dsl" = ["static/*.html", "static/*.css", "static/*.js", "static/vendor/*.js"]
